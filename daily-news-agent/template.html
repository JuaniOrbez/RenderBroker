<style>

    --bg: #eeece4;

    --surface-2: #e4e1d6;
    --ink: #171a24;
    --ink-soft: #4b5164;
    --hair: #cac6b8;
    --accent: #a8681f;
    --accent-ink: #ffffff;
    --mundo: #a8681f;
    --economia: #1f6f6b;
    --politica: #7a2e38;
    --tecnologia: #4d4a91;
    --focus: #1f6f6b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141c;
      --surface: #1b1e2a;
      --surface-2: #232838;
      --ink: #edeade;
      --ink-soft: #a8adc0;
      --hair: #343a4d;
      --accent: #d99a4e;
      --accent-ink: #171a24;
      --mundo: #d99a4e;
      --economia: #4fb3ad;
      --politica: #d97a89;
      --tecnologia: #9d97e0;
      --focus: #4fb3ad;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141c;
    --surface: #1b1e2a;
    --surface-2: #232838;
    --ink: #edeade;
    --ink-soft: #a8adc0;
    --hair: #343a4d;
    --accent: #d99a4e;
    --accent-ink: #171a24;
    --mundo: #d99a4e;
    --economia: #4fb3ad;
    --politica: #d97a89;
    --tecnologia: #9d97e0;
    --focus: #4fb3ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--focus); }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Masthead */
  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 1.75rem;
  }

  .masthead-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 900;
    font-size: clamp(2.1rem, 7vw, 3rem);
    letter-spacing: -0.01em;
    line-height: 0.95;
    margin: 0;
    text-wrap: balance;
  }

  .masthead-sub {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 0.4rem;
  }

  .masthead-date {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: right;
    white-space: nowrap;
  }

  /* Player */
  .player {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 1rem 1.15rem;
    margin-bottom: 2.25rem;
  }

  .play-btn {
    flex: none;
    width: 3.1rem;
    height: 3.1rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .play-btn svg { width: 1.15rem; height: 1.15rem; }

  .player-info { flex: 1; min-width: 0; }
  .player-label {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .player-status {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }

  .wave {
    flex: none;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 1.5rem;
  }
  .wave span {
    display: block;
    width: 3px;
    height: 40%;
    border-radius: 2px;
    background: var(--hair);
    transition: background 0.2s ease;
  }
  .wave.active span {
    background: var(--accent);
    animation: bounce 0.9s ease-in-out infinite;
  }
  .wave.active span:nth-child(1) { animation-delay: 0s; }
  .wave.active span:nth-child(2) { animation-delay: 0.12s; }
  .wave.active span:nth-child(3) { animation-delay: 0.24s; }
  .wave.active span:nth-child(4) { animation-delay: 0.36s; }
  .wave.active span:nth-child(5) { animation-delay: 0.48s; }
  @keyframes bounce {
    0%, 100% { height: 25%; }
    50% { height: 100%; }
  }

  .stop-btn {
    flex: none;
    border: 1px solid var(--hair);
    background: transparent;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .stop-btn:hover { border-color: var(--ink-soft); }
  .stop-btn[hidden] { display: none; }

  .no-tts {
    display: none;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  body.no-speech .player-controls { display: none; }
  body.no-speech .no-tts { display: block; }

  /* Sections */
  .section { margin-bottom: 2.25rem; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }

  .section-dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--cat-color);
  }

  .section-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
  }

  .section[data-cat="mundo"] { --cat-color: var(--mundo); }
  .section[data-cat="economia"] { --cat-color: var(--economia); }
  .section[data-cat="politica"] { --cat-color: var(--politica); }
  .section[data-cat="tecnologia"] { --cat-color: var(--tecnologia); }

  .item {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-left: 4px solid var(--cat-color);
    border-radius: 10px;
    padding: 0.95rem 1.1rem;
    margin-bottom: 0.7rem;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .item:last-child { margin-bottom: 0; }

  .item.speaking {
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1.5px var(--cat-color);
  }

  .item-headline {
    font-weight: 700;
    font-size: 1.02rem;
    margin: 0 0 0.3rem;
    text-wrap: balance;
  }

  .item-body {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.94rem;
    line-height: 1.5;
  }

  /* Sources */
  .sources {
    border-top: 1px solid var(--hair);
    padding-top: 1.25rem;
    margin-top: 2rem;
  }

  .sources-title {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.6rem;
  }

  .sources ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
    font-size: 0.82rem;
  }

  .sources a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--hair); }
  .sources a:hover { color: var(--focus); border-color: var(--focus); }
</style>

  // ---- Fin del contenido editable ----

  document.getElementById("dateLabel").textContent = NEWS.date;

  var CAT_LABEL = { mundo: "Mundo", economia: "Economía", politica: "Política", tecnologia: "Tecnología" };

  var sectionsEl = document.getElementById("sections");
  NEWS.sections.forEach(function (sec) {
    var secEl = document.createElement("section");
    secEl.className = "section";
    secEl.dataset.cat = sec.id;

    var head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = '<span class="section-dot"></span><h2 class="section-title">' + sec.label + '</h2>';
    secEl.appendChild(head);

    sec.items.forEach(function (item, i) {
      var itemEl = document.createElement("article");
      itemEl.className = "item";
      itemEl.id = sec.id + "-" + i;
      itemEl.innerHTML =
        '<p class="item-headline">' + item.headline + '</p>' +
        '<p class="item-body">' + item.body + '</p>';
      secEl.appendChild(itemEl);
    });

    sectionsEl.appendChild(secEl);
  });

  var sourceList = document.getElementById("sourceList");
  NEWS.sources.forEach(function (s) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = s.name;
    li.appendChild(a);
    sourceList.appendChild(li);
  });

  // ---- Lectura en voz alta ----
  var playBtn = document.getElementById("playBtn");
  var playIcon = document.getElementById("playIcon");
  var pauseIcon = document.getElementById("pauseIcon");
  var stopBtn = document.getElementById("stopBtn");
  var statusLabel = document.getElementById("statusLabel");
  var wave = document.getElementById("wave");

  var hasSpeech = "speechSynthesis" in window;
  if (!hasSpeech) {
    document.body.classList.add("no-speech");
  }

  var queue = [];
  var speaking = false;
  var paused = false;

  function buildQueue() {
    var list = [];
    list.push({ text: "Boletín de hoy, " + NEWS.date + "." , id: null });
    NEWS.sections.forEach(function (sec) {
      list.push({ text: CAT_LABEL[sec.id] + ".", id: null });
      sec.items.forEach(function (item, i) {
        list.push({
          text: item.headline + ". " + item.body,
          id: sec.id + "-" + i
        });
      });
    });
    return list;
  }

  function pickVoice() {
    var voices = window.speechSynthesis.getVoices();
    var preferred = ["es-AR", "es-ES", "es-MX", "es-US"];
    for (var p = 0; p < preferred.length; p++) {
      for (var v = 0; v < voices.length; v++) {
        if (voices[v].lang === preferred[p]) return voices[v];
      }
    }
    for (var v2 = 0; v2 < voices.length; v2++) {
      if (voices[v2].lang && voices[v2].lang.indexOf("es") === 0) return voices[v2];
    }
    return null;
  }

  function clearActive() {
    document.querySelectorAll(".item.speaking").forEach(function (el) {
      el.classList.remove("speaking");
    });
  }

  function setPlayingUI(isPlaying) {
    playIcon.style.display = isPlaying ? "none" : "block";
    pauseIcon.style.display = isPlaying ? "block" : "none";
    wave.classList.toggle("active", isPlaying);
    stopBtn.hidden = !(isPlaying || paused);
    playBtn.setAttribute("aria-label", isPlaying ? "Pausar la lectura" : "Reproducir el resumen en voz alta");
  }

  function speakNext(index) {
    if (index >= queue.length) {
      speaking = false;
      paused = false;
      clearActive();
      setPlayingUI(false);
      statusLabel.textContent = "Listo para reproducir";
      return;
    }
    var entry = queue[index];
    var utter = new SpeechSynthesisUtterance(entry.text);
    utter.lang = "es-AR";
    var voice = pickVoice();
    if (voice) utter.lang = voice.lang, utter.voice = voice;
    utter.rate = 1;

    utter.onstart = function () {
      clearActive();
      if (entry.id) {
        var el = document.getElementById(entry.id);
        if (el) {
          el.classList.add("speaking");
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          statusLabel.textContent = el.querySelector(".item-headline").textContent;
        }
      } else {
        statusLabel.textContent = "Reproduciendo…";
      }
    };
    utter.onend = function () {
      speakNext(index + 1);
    };
    utter.onerror = function () {
      speakNext(index + 1);
    };

    window.speechSynthesis.speak(utter);
  }

  function startSpeaking() {
    queue = buildQueue();
    speaking = true;
    paused = false;
    setPlayingUI(true);
    speakNext(0);
  }

  function togglePlay() {
    if (!hasSpeech) return;
    if (!speaking && !paused) {
      startSpeaking();
    } else if (speaking && !paused) {
      window.speechSynthesis.pause();
      paused = true;
      setPlayingUI(false);
      statusLabel.textContent = "En pausa";
    } else if (paused) {
      window.speechSynthesis.resume();
      paused = false;
      setPlayingUI(true);
    }
  }

  function stopSpeaking() {
    if (!hasSpeech) return;
    window.speechSynthesis.cancel();
    speaking = false;
    paused = false;
    clearActive();
    setPlayingUI(false);
    statusLabel.textContent = "Listo para reproducir";
  }

  playBtn.addEventListener("click", togglePlay);
  stopBtn.addEventListener("click", stopSpeaking);

  if (hasSpeech && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function () {};
  }

  window.addEventListener("beforeunload", function () {
    if (hasSpeech) window.speechSynthesis.cancel();
  });
</script>
