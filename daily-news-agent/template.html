<title>Frecuencia Diaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #eeece4;
    --surface: #ffffff;
    --surface-2: #e4e1d6;
    --ink: #171a24;
    --ink-soft: #4b5164;
    --hair: #cac6b8;
    --accent: #a8681f;
    --accent-ink: #ffffff;
    --mundo: #a8681f;
    --economia: #1f6f6b;
    --politica: #7a2e38;
    --tecnologia: #4d4a91;
    --focus: #1f6f6b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141c;
      --surface: #1b1e2a;
      --surface-2: #232838;
      --ink: #edeade;
      --ink-soft: #a8adc0;
      --hair: #343a4d;
      --accent: #d99a4e;
      --accent-ink: #171a24;
      --mundo: #d99a4e;
      --economia: #4fb3ad;
      --politica: #d97a89;
      --tecnologia: #9d97e0;
      --focus: #4fb3ad;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141c;
    --surface: #1b1e2a;
    --surface-2: #232838;
    --ink: #edeade;
    --ink-soft: #a8adc0;
    --hair: #343a4d;
    --accent: #d99a4e;
    --accent-ink: #171a24;
    --mundo: #d99a4e;
    --economia: #4fb3ad;
    --politica: #d97a89;
    --tecnologia: #9d97e0;
    --focus: #4fb3ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--focus); }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Masthead */
  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 1.75rem;
  }

  .masthead-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 900;
    font-size: clamp(2.1rem, 7vw, 3rem);
    letter-spacing: -0.01em;
    line-height: 0.95;
    margin: 0;
    text-wrap: balance;
  }

  .masthead-sub {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 0.4rem;
  }

  .masthead-date {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: right;
    white-space: nowrap;
  }

  /* Player */
  .player {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 1rem 1.15rem;
    margin-bottom: 2.25rem;
  }

  .play-btn {
    flex: none;
    width: 3.1rem;
    height: 3.1rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .play-btn svg { width: 1.15rem; height: 1.15rem; }

  .player-info { flex: 1; min-width: 0; }
  .player-label {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .player-status {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }

  .wave {
    flex: none;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 1.5rem;
  }
  .wave span {
    display: block;
    width: 3px;
    height: 40%;
    border-radius: 2px;
    background: var(--hair);
    transition: background 0.2s ease;
  }
  .wave.active span {
    background: var(--accent);
    animation: bounce 0.9s ease-in-out infinite;
  }
  .wave.active span:nth-child(1) { animation-delay: 0s; }
  .wave.active span:nth-child(2) { animation-delay: 0.12s; }
  .wave.active span:nth-child(3) { animation-delay: 0.24s; }
  .wave.active span:nth-child(4) { animation-delay: 0.36s; }
  .wave.active span:nth-child(5) { animation-delay: 0.48s; }
  @keyframes bounce {
    0%, 100% { height: 25%; }
    50% { height: 100%; }
  }

  .stop-btn {
    flex: none;
    border: 1px solid var(--hair);
    background: transparent;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .stop-btn:hover { border-color: var(--ink-soft); }
  .stop-btn[hidden] { display: none; }

  .no-tts {
    display: none;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  body.no-speech .player-controls { display: none; }
  body.no-speech .no-tts { display: block; }

  /* Sections */
  .section { margin-bottom: 2.25rem; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }

  .section-dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--cat-color);
  }

  .section-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin: 0;
  }

  .section[data-cat="mundo"] { --cat-color: var(--mundo); }
  .section[data-cat="economia"] { --cat-color: var(--economia); }
  .section[data-cat="politica"] { --cat-color: var(--politica); }
  .section[data-cat="tecnologia"] { --cat-color: var(--tecnologia); }

  .item {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-left: 4px solid var(--cat-color);
    border-radius: 10px;
    padding: 0.95rem 1.1rem;
    margin-bottom: 0.7rem;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .item:last-child { margin-bottom: 0; }

  .item.speaking {
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1.5px var(--cat-color);
  }

  .item-headline {
    font-weight: 700;
    font-size: 1.02rem;
    margin: 0 0 0.3rem;
    text-wrap: balance;
  }

  .item-body {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.94rem;
    line-height: 1.5;
  }

  /* Sources */
  .sources {
    border-top: 1px solid var(--hair);
    padding-top: 1.25rem;
    margin-top: 2rem;
  }

  .sources-title {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 0.6rem;
  }

  .sources ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
    font-size: 0.82rem;
  }

  .sources a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--hair); }
  .sources a:hover { color: var(--focus); border-color: var(--focus); }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1 class="masthead-title">Frecuencia<br>Diaria</h1>
      <p class="masthead-sub">Mundo · Economía · Política · Tecnología</p>
    </div>
    <p class="masthead-date" id="dateLabel"></p>
  </header>

  <div class="player">
    <button class="play-btn" id="playBtn" aria-label="Reproducir el resumen en voz alta">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="player-info">
      <p class="player-label">Escuchar el boletín</p>
      <p class="player-status" id="statusLabel">Listo para reproducir</p>
      <p class="no-tts">Este navegador no permite lectura en voz alta. El texto está más abajo.</p>
    </div>
    <div class="player-controls" style="display:flex; align-items:center; gap:1rem;">
      <div class="wave" id="wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <button class="stop-btn" id="stopBtn" hidden>Detener</button>
    </div>
  </div>

  <div id="sections"></div>

  <div class="sources">
    <p class="sources-title">Fuentes de hoy</p>
    <ul id="sourceList"></ul>
  </div>
</div>

<script>
  // ---- Contenido del día: editar esta sección para actualizar el boletín ----
  var NEWS = {
    date: "viernes 2 de octubre de 2026",
    sections: [
      {
        id: "mundo",
        label: "Mundo",
        items: [
          {
            headline: "Lula y Flávio Bolsonaro cierran campaña en Río de Janeiro y Minas Gerais",
            body: "Ambos candidatos se vuelcan en actos finales a tres días de las elecciones presidenciales en Brasil."
          },
          {
            headline: "Emiratos Árabes Unidos investiga el incidente violento a bordo de un avión que volaba a Tel Aviv",
            body: "La aeronave debió aterrizar de emergencia en Arabia Saudí; los pasajeros israelíes ya llegados a su país son recibidos como héroes."
          },
          {
            headline: "Egipto inaugura la primera edición del Foro Alamein África",
            body: "El encuentro bienal reúne a jefes de Estado y directivos de instituciones financieras para impulsar sectores clave del continente."
          },
          {
            headline: "La India vive protestas nacionales que exigen la renuncia del jefe de la comisión electoral",
            body: "Los manifestantes reclaman la salida de Gyanesh Kumar al frente del organismo."
          }
        ]
      },
      {
        id: "economia",
        label: "Economía",
        items: [
          {
            headline: "El Brent cotiza sobre los 102 dólares y el WTI cerca de los 92,7 dólares",
            body: "China suspendió la mayoría de sus exportaciones de combustible durante octubre, lo que agrava la tensión en el mercado global de diésel."
          },
          {
            headline: "Texas declara el estado de emergencia por escasez de diésel",
            body: "El mayor productor de petróleo de Estados Unidos enfrenta dificultades de abastecimiento en medio de la tensión energética mundial."
          },
          {
            headline: "Italia negocia ampliar su margen fiscal para energía y defensa",
            body: "El acuerdo contempla un posible aumento del déficit y genera tensiones dentro de la coalición de gobierno."
          },
          {
            headline: "Rusia escala su retórica contra Europa",
            body: "Moscú amenazó con el uso de armas nucleares para defender Kaliningrado y expropió temporalmente activos de empresas como Nestlé y Auchan."
          }
        ]
      },
      {
        id: "politica",
        label: "Política",
        items: [
          {
            headline: "Lula y Bolsonaro cierran campaña a tres días de las elecciones brasileñas",
            body: "Los actos finales se concentraron en dos de los estados más poblados del país."
          },
          {
            headline: "Argentina presiona al Reino Unido con un ultimátum por las islas Malvinas",
            body: "Javier Milei fijó un plazo de dos semanas antes de llevar el caso a un arbitraje internacional si Londres no detiene los proyectos petroleros en la cuenca de Sea Lion."
          },
          {
            headline: "Los cancilleres de la OEA celebran una reunión extraordinaria por la crisis en Nicaragua",
            body: "El encuentro se da después de que Daniel Ortega y Rosario Murillo anunciaran que no habrá más elecciones competitivas en el país."
          },
          {
            headline: "Taiwán inicia una visita oficial a Guatemala para fortalecer la cooperación bilateral",
            body: "El canciller taiwanés Lin Chia-lung busca impulsar inversiones en tecnología, salud e infraestructura."
          }
        ]
      },
      {
        id: "tecnologia",
        label: "Tecnología",
        items: [
          {
            headline: "Nvidia lanza un sistema para evitar que los agentes de inteligencia artificial se descontrolen",
            body: "La herramienta responde al incidente de seguridad que afectó a Hugging Face semanas atrás."
          },
          {
            headline: "YouTube castigará los videos resubidos en su feed de Shorts",
            body: "La plataforma reducirá el alcance y la distribución de los contenidos que reutilizan material ajeno."
          },
          {
            headline: "La ESA y Airbus prueban en Almería un prototipo de vehículo explorador marciano",
            body: "Las pruebas validan tecnologías para la misión ExoMars Rosalind Franklin, cuyo aterrizaje en Marte está previsto para 2030."
          },
          {
            headline: "Bitcoin sube a 86.334 dólares impulsado por el optimismo de «uptober»",
            body: "La criptomoneda acumula su tercera semana consecutiva de ganancias, con una suba semanal del 2,6 por ciento."
          }
        ]
      }
    ],
    sources: [
      { name: "Infobae (mundo)", url: "https://www.infobae.com/america/agencias/2026/10/02/viernes-2-de-octubre-de-2026-0200-gmt/" },
      { name: "Euribor (petróleo)", url: "https://euribor.com.es/2026/10/02/precio-petroleo-hoy-2-octubre-2026" },
      { name: "Infobae (política, Taiwán-Guatemala)", url: "https://www.infobae.com/guatemala/2026/10/02/guatemala-y-taiwan-impulsan-inversiones-en-tecnologia-salud-e-infraestructura-durante-visita-oficial/" },
      { name: "Infobae (cripto)", url: "https://www.infobae.com/tecno/2026/10/02/criptomonedas-valor-de-las-principales-divisas-digitales-hoy-viernes-2-de-octubre/" }
    ]
  };
  // ---- Fin del contenido editable ----

  document.getElementById("dateLabel").textContent = NEWS.date;

  var CAT_LABEL = { mundo: "Mundo", economia: "Economía", politica: "Política", tecnologia: "Tecnología" };

  var sectionsEl = document.getElementById("sections");
  NEWS.sections.forEach(function (sec) {
    var secEl = document.createElement("section");
    secEl.className = "section";
    secEl.dataset.cat = sec.id;

    var head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = '<span class="section-dot"></span><h2 class="section-title">' + sec.label + '</h2>';
    secEl.appendChild(head);

    sec.items.forEach(function (item, i) {
      var itemEl = document.createElement("article");
      itemEl.className = "item";
      itemEl.id = sec.id + "-" + i;
      itemEl.innerHTML =
        '<p class="item-headline">' + item.headline + '</p>' +
        '<p class="item-body">' + item.body + '</p>';
      secEl.appendChild(itemEl);
    });

    sectionsEl.appendChild(secEl);
  });

  var sourceList = document.getElementById("sourceList");
  NEWS.sources.forEach(function (s) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = s.name;
    li.appendChild(a);
    sourceList.appendChild(li);
  });

  // ---- Lectura en voz alta ----
  var playBtn = document.getElementById("playBtn");
  var playIcon = document.getElementById("playIcon");
  var pauseIcon = document.getElementById("pauseIcon");
  var stopBtn = document.getElementById("stopBtn");
  var statusLabel = document.getElementById("statusLabel");
  var wave = document.getElementById("wave");

  var hasSpeech = "speechSynthesis" in window;
  if (!hasSpeech) {
    document.body.classList.add("no-speech");
  }

  var queue = [];
  var speaking = false;
  var paused = false;

  function buildQueue() {
    var list = [];
    list.push({ text: "Boletín de hoy, " + NEWS.date + "." , id: null });
    NEWS.sections.forEach(function (sec) {
      list.push({ text: CAT_LABEL[sec.id] + ".", id: null });
      sec.items.forEach(function (item, i) {
        list.push({
          text: item.headline + ". " + item.body,
          id: sec.id + "-" + i
        });
      });
    });
    return list;
  }

  function pickVoice() {
    var voices = window.speechSynthesis.getVoices();
    var preferred = ["es-AR", "es-ES", "es-MX", "es-US"];
    for (var p = 0; p < preferred.length; p++) {
      for (var v = 0; v < voices.length; v++) {
        if (voices[v].lang === preferred[p]) return voices[v];
      }
    }
    for (var v2 = 0; v2 < voices.length; v2++) {
      if (voices[v2].lang && voices[v2].lang.indexOf("es") === 0) return voices[v2];
    }
    return null;
  }

  function clearActive() {
    document.querySelectorAll(".item.speaking").forEach(function (el) {
      el.classList.remove("speaking");
    });
  }

  function setPlayingUI(isPlaying) {
    playIcon.style.display = isPlaying ? "none" : "block";
    pauseIcon.style.display = isPlaying ? "block" : "none";
    wave.classList.toggle("active", isPlaying);
    stopBtn.hidden = !(isPlaying || paused);
    playBtn.setAttribute("aria-label", isPlaying ? "Pausar la lectura" : "Reproducir el resumen en voz alta");
  }

  function speakNext(index) {
    if (index >= queue.length) {
      speaking = false;
      paused = false;
      clearActive();
      setPlayingUI(false);
      statusLabel.textContent = "Listo para reproducir";
      return;
    }
    var entry = queue[index];
    var utter = new SpeechSynthesisUtterance(entry.text);
    utter.lang = "es-AR";
    var voice = pickVoice();
    if (voice) utter.lang = voice.lang, utter.voice = voice;
    utter.rate = 1;

    utter.onstart = function () {
      clearActive();
      if (entry.id) {
        var el = document.getElementById(entry.id);
        if (el) {
          el.classList.add("speaking");
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          statusLabel.textContent = el.querySelector(".item-headline").textContent;
        }
      } else {
        statusLabel.textContent = "Reproduciendo…";
      }
    };
    utter.onend = function () {
      speakNext(index + 1);
    };
    utter.onerror = function () {
      speakNext(index + 1);
    };

    window.speechSynthesis.speak(utter);
  }

  function startSpeaking() {
    queue = buildQueue();
    speaking = true;
    paused = false;
    setPlayingUI(true);
    speakNext(0);
  }

  function togglePlay() {
    if (!hasSpeech) return;
    if (!speaking && !paused) {
      startSpeaking();
    } else if (speaking && !paused) {
      window.speechSynthesis.pause();
      paused = true;
      setPlayingUI(false);
      statusLabel.textContent = "En pausa";
    } else if (paused) {
      window.speechSynthesis.resume();
      paused = false;
      setPlayingUI(true);
    }
  }

  function stopSpeaking() {
    if (!hasSpeech) return;
    window.speechSynthesis.cancel();
    speaking = false;
    paused = false;
    clearActive();
    setPlayingUI(false);
    statusLabel.textContent = "Listo para reproducir";
  }

  playBtn.addEventListener("click", togglePlay);
  stopBtn.addEventListener("click", stopSpeaking);

  if (hasSpeech && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function () {};
  }

  window.addEventListener("beforeunload", function () {
    if (hasSpeech) window.speechSynthesis.cancel();
  });
</script>
